[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pads-dialogue"
version = "0.1.0"
description = "Research code and simulator for PADS: A Politeness Adaptive Dialogue System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23.5,<2"]

[project.optional-dependencies]
train = ["tensorflow>=2.15,<2.16"]
politeness = ["simpletransformers>=0.64,<0.71"]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
pads = "pads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pads = ["action_templates.json"]
